[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-course-labs"
version = "0.1.0"
description = "Ambientes reproduzíveis para os laboratórios do curso de customização de LLMs"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
cpu = [
  "torch>=2.4,<3",
  "transformers>=4.46,<6",
  "tokenizers>=0.20,<1",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "jupyter>=1,<2",
]
mlx = [
  "mlx<1",
  "mlx-lm[train]<1",
]
rl = [
  "mlx-lm-lora<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
test = [
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
