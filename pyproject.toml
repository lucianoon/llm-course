[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-course-labs"
version = "0.1.0"
description = "Laboratórios reproduzíveis de engenharia e customização de LLMs em português"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Luciano de Oliveira Nunes" },
]
keywords = ["llm", "fine-tuning", "rag", "agents", "portuguese"]
requires-python = ">=3.11,<3.13"
dependencies = []


[project.urls]
Homepage = "https://github.com/lucianoon/llm-course"
Repository = "https://github.com/lucianoon/llm-course"
Issues = "https://github.com/lucianoon/llm-course/issues"

[project.optional-dependencies]
cpu = [
  "torch>=2.4,<3",
  "transformers>=4.46,<6",
  "tokenizers>=0.20,<1",
  "datasets>=5.0.1,<6",
  "accelerate>=1,<2",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "jupyter>=1,<2",
]
mlx = [
  "mlx<1",
  "mlx-lm[train]<1",
]
rl = [
  "mlx-lm-lora<1",
]
gpu = [
  "torch>=2.4,<3",
  "transformers>=5.2,<6",
  "datasets>=5.0.1,<6",
  "accelerate>=1,<2",
  "peft>=0.17,<1",
  "trl>=0.25,<1",
  "bitsandbytes>=0.46,<1",
  "huggingface-hub>=0.34,<2",
]
serving = [
  "vllm>=0.11,<1",
  "httpx>=0.28,<1",
]
tracking = [
  "wandb>=0.21,<1",
]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]
test = [
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/` fica na raiz do repositório e os testes o importam por nome; sem isto
# a raiz não entra no sys.path e a coleta falha com ModuleNotFoundError.
pythonpath = ["."]
# O extra CPU traz AnyIO via Jupyter; estes testes são síncronos e não precisam do
# plugin, que pode bloquear a coleta em alguns ambientes macOS.
addopts = "-q -p no:anyio"

[tool.ruff]
target-version = "py311"
line-length = 100
