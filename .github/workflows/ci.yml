name: verificacoes

on:
  push:
  pull_request:

jobs:
  testes-rapidos:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sincronizar ambiente pelo lockfile
        # O extra cpu entra para que bumps de pandas, transformers, datasets e
        # matplotlib sejam de fato instalados e importados no CI. Antes, PRs do
        # Dependabot para essas libs passavam verdes sem que elas fossem sequer instaladas.
        run: uv sync --extra dev --extra test --extra cpu --locked
      - name: Importar dependências dos labs CPU
        run: uv run python -c "import pandas, transformers, datasets, matplotlib, accelerate; print('pandas', pandas.__version__, '| transformers', transformers.__version__, '| datasets', datasets.__version__)"
      - name: Compilar fontes Python
        # -x exclui o .venv que o `uv sync` acabou de criar: ele traz arquivos de
        # dependências com sintaxe de versões mais novas do Python (ex.: torch tem um
        # módulo só de 3.12) e o job de 3.11 falhava neles, não em código deste repo.
        run: uv run python -m compileall -q -x '(^|/)\.venv/' .
      - name: Gerar notebooks derivados
        run: uv run python tools/build_notebooks.py
      - name: Verificar qualidade estática
        run: uv run ruff check .
      - name: Executar testes sem downloads de modelos
        run: uv run python -m pytest
      - name: Executar portão de produção (módulo 19)
        # Avaliação como portão: reexecuta o lab de produção e valida que o conjunto
        # dourado passa do piso, o serviço mantém sucesso e o disjuntor abre.
        run: uv run python tools/eval_ci.py
      - name: Executar novos labs CPU de supervisão e QAT
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run python modulo-07-reasoning/lab_process_supervision.py
          uv run python modulo-11-inferencia/lab_qat.py
