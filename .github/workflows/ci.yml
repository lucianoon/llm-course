name: verificacoes

on:
  push:
  pull_request:

jobs:
  testes-rapidos:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sincronizar ambiente pelo lockfile
        run: uv sync --extra dev --extra test --locked
      - name: Compilar fontes Python
        run: uv run python -m compileall -q .
      - name: Gerar notebooks derivados
        run: uv run python tools/build_notebooks.py
      - name: Verificar qualidade estática
        run: uv run ruff check .
      - name: Executar testes sem downloads de modelos
        run: uv run python -m pytest
      - name: Executar novos labs CPU de supervisão e QAT
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          uv run python modulo-07-reasoning/lab_process_supervision.py
          uv run python modulo-11-inferencia/lab_qat.py
